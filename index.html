<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hadan Alves — Design Gráfico Premium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#050505;--black2:#0c0c0c;--card:#121212;--card2:#181818;
  --white:#fff7e8;--muted:#9a927f;--muted2:#6f675a;
  --gold:#d6a83d;--gold2:#ffd36a;--gold3:#8b6424;
  --line:rgba(214,168,61,.24);--glow:rgba(214,168,61,.18);
  --danger:#ff3d64;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:Inter,sans-serif;background:var(--black);color:var(--white);overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.25;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 250 250' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");
}
a{color:inherit}
.marquee-top{
  position:fixed;top:0;left:0;right:0;z-index:700;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));
  color:#090909;overflow:hidden;font-size:.68rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;padding:.35rem 0
}
.marquee-top span{display:inline-block;white-space:nowrap;animation:m1 18s linear infinite}
@keyframes m1{from{transform:translateX(0)}to{transform:translateX(-50%)}}
nav{
  position:fixed;top:1.55rem;left:0;right:0;z-index:650;display:flex;align-items:center;justify-content:space-between;
  padding:1.05rem 4.5rem;background:rgba(5,5,5,.82);border-bottom:1px solid var(--line);backdrop-filter:blur(18px)
}
.logo{font-family:Bebas Neue,sans-serif;font-size:1.65rem;letter-spacing:.16em;text-decoration:none;color:var(--gold)}
.logo b{color:var(--white);font-weight:400}
.navlinks{display:flex;gap:2rem;align-items:center;list-style:none}
.navlinks a{text-decoration:none;color:var(--muted);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;transition:.25s}
.navlinks a:hover{color:var(--gold2)}
.nav-cta{background:var(--gold);color:#080808!important;padding:.7rem 1.15rem;font-weight:900;border-radius:999px}
.hamb{display:none;flex-direction:column;gap:5px;cursor:pointer}.hamb span{width:24px;height:2px;background:var(--gold)}

.hero{min-height:100vh;padding:9rem 4.5rem 5rem;position;display;grid-template-columns:1.08fr .92fr;align-items;gap:3rem;overflow}.hero{content:"";position;inset:-20%;background:radial-gradient(circle at 78% 34%,rgba(214,168,61,.22),transparent 28%),radial-gradient(circle at 8% 84%,rgba(255,211,106,.10),transparent 30%),linear-gradient(120deg,transparent,rgba(214,168,61,.05),transparent);filter(4px)}.grid-lines{position;inset:0;background-image(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:90px 90px;opacity:.08;mask-image(to bottom,black,transparent 95%)}.hero-content{position;z-index:2}.badge{display;gap:.7rem;align-items;border:1px solid var(--line);background(214,168,61,.08);padding:.65rem 1rem;border-radius:999px;color(--gold2);font-size:.68rem;font-weight:800;letter-spacing:.18em;text-transform;margin-bottom:1.5rem}.badge i{width:8px;height:8px;border-radius:50%;background(--gold2);box-shadow:0 0 22px var(--gold2)}h1{font-family Display,serif;font-size(3.4rem,7.2vw,7rem);line-height:.88;letter-spacing:-.06em;font-weight:900;max-width:820px}h1 em{font-style;font-weight:500;color(--gold2);text-shadow:0 0 45px rgba(255,211,106,.18)}.hero p{max-width:650px;margin:1.6rem 0 2.2rem;color(--muted);font-size:1.08rem;line-height:1.85}.hero-actions{display;gap:1rem;flex-wrap}.btn{display;align-items;justify-content;gap:.55rem;text-decoration;text-transform;letter-spacing:.18em;font-size:.74rem;font-weight:900;padding:1rem 1.6rem;border-radius:999px;transition:.25s;border:1px solid transparent}.btn-gold{background(135deg,var(--gold),var(--gold2));color:#050505;box-shadow:0 18px 60px rgba(214,168,61,.18)}.btn-gold{transform(-3px);box-shadow:0 22px 80px rgba(214,168,61,.28)}.btn-ghost{border-color(--line);color(--gold2);background(255,255,255,.02)}.btn-ghost{background(214,168,61,.08)}.hero-metrics{display;grid-template-columns(3,1fr);gap:1px;background(--line);margin-top:3rem;max-width:720px}.metric{background(5,5,5,.92);padding:1.5rem}.metric strong{display;font-family Neue,sans-serif;color(--gold2);font-size:2.7rem;line-height:1}.metric span{font-size:.7rem;color(--muted);letter-spacing:.15em;text-transform}.hero-visual{position;z-index:2;min-height:560px;display;align-items;justify-content}.orbit{width(36vw,430px);height(36vw,430px);border:1px solid var(--line);border-radius:50%;position;display;align-items;justify-content;animation 18s linear infinite}.orbit,.orbit{content:"";position;border:1px solid rgba(214,168,61,.16);border-radius:50%}.orbit.orbit@keyframes spin{to{transform(360deg)}}.monogram{animation 18s linear infinite;text-align}@keyframes spinBack{to{transform(-360deg)}}.diamond{width:185px;height:185px;border:2px solid var(--gold);transform(45deg);display;align-items;justify-content;box-shadow:0 0 80px rgba(214,168,61,.17)}.diamond span{transform(-45deg);font-family Neue,sans-serif;color(--gold2);font-size:5.5rem}.float{position;background(18,18,18,.92);border:1px solid var(--line);padding:1rem 1.15rem;border-radius:18px;box-shadow:0 20px 80px rgba(0,0,0,.4);animation 4s ease-in-out infinite}.float small{display;color(--gold2);letter-spacing:.18em;text-transform;font-size:.58rem;font-weight:900}.float b{font-family Neue,sans-serif;font-size:1.7rem}.float p{font-size:.72rem;color(--muted);margin:.1rem 0 0}.f1{top:6%;left:3%}.f2{right:0;top:33%;animation-delay:1s}.f3{left:9%;bottom:6%;animation-delay:2s}@keyframes float{50%{transform(-12px)}}

.ticker{background(--card2);border-block:1px solid var(--line);overflow;padding:1rem 0}
